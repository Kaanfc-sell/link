<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DENİZKENT GAYRİMENKUL - sahibinden.com İlanımız</title>
    <!-- 2 Saniye Sonra Otomatik Yönlendirme (Yedek) -->
    <meta http-equiv="refresh" content="2;url=https://shbd.io/s/FVrVDrla">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #181818; 
            color: #ffffff;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .shbd-card {
            background: #242424;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 208, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Sahibinden Sarı Detay Çizgisi */
        .shbd-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: #FFC400;
        }

        /* Mavi Yazıyla Firma İsmi */
        .brand-title {
            font-size: 20px;
            font-weight: 900;
            color: #2563eb; /* Şık Mavi */
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .shbd-badge {
            display: inline-block;
            background: #FFC400;
            color: #111111;
            font-size: 16px;
            font-weight: 900;
            padding: 5px 14px;
            border-radius: 8px;
            letter-spacing: -0.3px;
            margin-bottom: 18px;
        }

        .title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #aaaaaa;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .btn-shbd {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #FFC400;
            color: #111111;
            text-decoration: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 800;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 196, 0, 0.25);
        }

        .btn-shbd:active {
            transform: scale(0.98);
            background: #e6b000;
        }

        .loader-box {
            margin-top: 20px;
            font-size: 12px;
            color: #888888;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #FFC400;
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="shbd-card">
        <!-- Mavi Yazıyla Gayrimenkul / Firma İsmi -->
        <div class="brand-title">DENİZKENT GAYRİMENKUL</div>

        <a href="https://shbd.io/s/FVrVDrla" class="btn-shbd" id="shbdLink">
            💛 sahibinden.com'da Görüntüle
        </a>

        <div class="loader-box">
            <div class="dot"></div>
            <span>Otomatik yönlendiriliyorsunuz...</span>
        </div>
    </div>

    <script>
        // Sayfa açıldıktan 1.5 saniye sonra otomatik git
        setTimeout(function() {
            window.location.href = "https://shbd.io/s/FVrVDrla";
        }, 1500);
    </script>

</body>
</html>
