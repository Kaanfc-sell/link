<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DORUK OTOMOTİV - sahibinden.com İlanımız</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #181818; 
            color: #ffffff;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .shbd-card {
            background: #242424;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 208, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Sahibinden Sarı Detay Çizgisi */
        .shbd-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: #FFC400;
        }

        /* Çift Renkli Firma İsmi */
        .brand-title {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .
