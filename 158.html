<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBAN / Ödeme Bilgileri</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .iban-card { 
            background: #ffffff; 
            width: 100%; 
            max-width: 380px; 
            border-radius: 24px; 
            padding: 28px 24px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); 
            text-align: center;
        }
        .bank-icon {
            width: 56px;
            height: 56px;
            background: #e7f0ff;
            color: #0d6efd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        .bank-icon svg { width: 28px; height: 28px; fill: currentColor; }
        h2 { font-size: 20px; color: #1a1a1a; font-weight: 700; margin-bottom: 6px; }
        p.subtitle { font-size: 13px; color: #6c757d; margin-bottom: 24px; }
        
        .info-group {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            text-align: left;
        }
        .label { font-size: 11px; text-transform: uppercase; color: #8d99ae; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
        .value { font-size: 15px; color: #2b2d42; font-weight: 600; margin-bottom: 14px; word-break: break-all; display: flex; justify-content: space-between; align-items: center; }
        .iban-value { font-size: 16px; font-family: monospace; letter-spacing: 0.5px; color: #0d6efd; margin-bottom: 0; }

        .btn-main {
            width: 100%;
            background: #0d6efd;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.25);
        }
        .btn-main:active { transform: scale(0.98); }
        .btn-main.copied { background: #198754; box-shadow: 0 4px 12px rgba(25, 135, 84, 0.25); }

        .mini-copy {
            background: #e7f0ff;
            color: #0d6efd;
            border: none;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .footer-note { font-size: 12px; color: #adb5bd; margin-top: 16px; }
    </style>
</head>
<body>

    <div class="iban-card">
        <div class="bank-icon">
            <svg viewBox="0 0 24 24"><path d="M4 10h16v2H4zm2 4h3v4H6zm5 0h3v4h-3zm5 0h3v4h-3zM2 6l10-4 10 4v2H2z"/></svg>
        </div>
        <h2>Banka Transferi / IBAN</h2>
        <p class="subtitle">Lütfen ödeme yaparken alıcı adına dikkat ediniz.</p>

        <div class="info-group">
            <div class="label">Alıcı Adı / Unvan</div>
            <div class="value">
                <span id="aliciAdi">Kaan Turgut</span>
                <button class="mini-copy" onclick="kopyalaMetin('aliciAdi', this)">Kopyala</button>
            </div>

            <div class="label">IBAN Numarası</div>
            <div class="value iban-value" id="ibanNo">TR12 0015 7000 0000 0139 9940 85</div>
        </div>

        <button class="btn-main" id="mainBtn" onclick="kopyalaIban()">
            <span>IBAN'ı Kopyala</span>
        </button>

        <div class="footer-note">Kopyaladıktan sonra banka uygulamanıza yapıştırabilirsiniz.</div>
    </div>

    <script>
        function kopyalaIban() {
            var iban = document.getElementById("ibanNo").innerText.replace(/\s+/g, '');
            var btn = document.getElementById("mainBtn");

            navigator.clipboard.writeText(iban).then(function() {
                btn.classList.add("copied");
                btn.innerHTML = "✓ IBAN Hafızaya Alındı!";
                setTimeout(function() {
                    btn.classList.remove("copied");
                    btn.innerHTML = "<span>IBAN'ı Kopyala</span>";
                }, 2500);
            });
        }

        function kopyalaMetin(id, btn) {
            var metin = document.getElementById(id).innerText;
            navigator.clipboard.writeText(metin).then(function() {
                var eskiText = btn.innerText;
                btn.innerText = "Kopyalandı!";
                setTimeout(function() { btn.innerText = eskiText; }, 2000);
            });
        }
    </script>
</body>
</html>
