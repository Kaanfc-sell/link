<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödeme Bilgileri - Enpara</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f4f5f7; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 16px;
        }
        .iban-card { 
            background: #ffffff; 
            width: 100%; 
            max-width: 380px; 
            border-radius: 20px; 
            padding: 28px 20px; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06); 
            text-align: center;
            border: 1px solid #eaedf1;
        }
        
        /* Sade ve Orijinal Enpara Logosu */
        .enpara-brand {
            font-size: 32px;
            font-weight: 800;
            color: #5c068c; /* Enpara Kurumsal Mor */
            letter-spacing: -1px;
            margin-bottom: 12px;
            display: inline-block;
            line-height: 1;
        }

        h2 { font-size: 19px; color: #222222; font-weight: 700; margin-bottom: 4px; }
        p.subtitle { font-size: 13px; color: #666666; margin-bottom: 22px; }
        
        .info-group {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: left;
        }
        
        .field-item {
            margin-bottom: 14px;
        }
        .field-item:last-child {
            margin-bottom: 0;
        }

        .label { 
            font-size: 11px; 
            text-transform: uppercase; 
            color: #718096; 
            font-weight: 700; 
            letter-spacing: 0.5px; 
            margin-bottom: 6px; 
        }

        /* Yan Yana Düzen */
        .value-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 10px; 
        }

        .value-text { 
            font-size: 15px; 
            color: #1a202c; 
            font-weight: 600; 
            word-break: break-all;
        }

        .iban-text {
            font-size: 13px;
            font-family: monospace;
            color: #5c068c;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        /* Kopyala Butonları */
        .btn-copy {
            background: #5c068c;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(92, 6, 140, 0.15);
        }
        .btn-copy:active { transform: scale(0.95); }
        .btn-copy.copied { 
            background: #28a745; 
            box-shadow: 0 2px 6px rgba(40, 167, 69, 0.2); 
        }

        .footer-note { font-size: 12px; color: #a0aec0; margin-top: 14px; }
    </style>
</head>
<body>

    <div class="iban-card">
        <!-- Orijinal Enpara Logosu -->
        <div class="enpara-brand">
            Enpara
        </div>

        <h2>Banka Transferi / IBAN</h2>
        <p class="subtitle">Ödeme yapmak için bilgileri kopyalayabilirsiniz.</p>

        <div class="info-group">
            <!-- ALICI ADI ALANI -->
            <div class="field-item">
                <div class="label">Alıcı Adı / Unvan</div>
                <div class="value-row">
                    <span class="value-text" id="aliciAdi">Kaan Turgut</span>
                    <button class="btn-copy" onclick="kopyala('aliciAdi', this, false)">Kopyala</button>
                </div>
            </div>

            <hr style="border: none; border-top: 1px solid #edf2f7; margin: 12px 0;">

            <!-- IBAN ALANI -->
            <div class="field-item">
                <div class="label">IBAN Numarası</div>
                <div class="value-row">
                    <span class="value-text iban-text" id="ibanNo">TR12 0015 7000 0000 0139 9940 85</span>
                    <button class="btn-copy" onclick="kopyala('ibanNo', this, true)">Kopyala</button>
                </div>
            </div>
        </div>

        <div class="footer-note">Güvenli şekilde ödemenizi gerçekleştirebilirsiniz.</div>
    </div>

    <script>
        function kopyala(elementId, btn, isIban) {
            var metin = document.getElementById(elementId).innerText;
            if (isIban) {
                metin = metin.replace(/\s+/g, ''); // Banka uygulaması için boşluksuz kopyalar
            }

            navigator.clipboard.writeText(metin).then(function() {
                var eskiMetin = btn.innerText;
                btn.innerText = "✓ Alındı";
                btn.classList.add("copied");

                setTimeout(function() { 
                    btn.innerText = eskiMetin; 
                    btn.classList.remove("copied");
                }, 2000);
            });
        }
    </script>
</body>
</html>
