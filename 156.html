<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kılıç Grup - Gayrimenkul İlanları</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f4f4f4; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 16px;
        }
        .card { 
            background: #ffffff; 
            width: 100%; 
            max-width: 380px; 
            border-radius: 20px; 
            padding: 28px 20px; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); 
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        
        /* Kurumsal Sahibinden Rozeti */
        .badge {
            display: inline-block;
            background: #ffe600; /* Sahibinden Sarısı */
            color: #111111;
            font-size: 11px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        h2 { font-size: 22px; color: #111111; font-weight: 800; margin-bottom: 4px; }
        p.subtitle { font-size: 13px; color: #666666; margin-bottom: 22px; }

        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Ana Sahibinden Butonu */
        .btn-main {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #ffe600;
            color: #111111;
            font-size: 15px;
            font-weight: 800;
            padding: 15px 20px;
            border-radius: 14px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(255, 230, 0, 0.3);
            transition: all 0.2s ease;
        }
        .btn-main:active { transform: scale(0.97); }

        /* İkincil Butonlar (WhatsApp / Telefon) */
        .btn-sub {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #f8f9fa;
            border: 1.5px solid #e2e8f0;
            color: #333333;
            font-size: 14px;
            font-weight: 700;
            padding: 13px 18px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-sub:active { background: #edf2f7; }

        .footer-note { font-size: 12px; color: #a0aec0; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">
            sahibinden.com Mağazası
        </div>

        <h2>KILIÇ GRUP</h2>
        <p class="subtitle">Gayrimenkul ve Proje Portföyümüz</p>

        <div class="btn-stack">
            <!-- 1. Sahibinden İlan Linki -->
            <a href="https://shbd.io/s/FdCOXT5s" class="btn-main" target="_blank">
                <span>🏷️</span> Güncel İlanlarımızı Gör
            </a>

            <!-- 2. WhatsApp İletişim Hattı -->
            <a href="https://wa.me/905425242477?text=Merhaba,%20ilanlariniz%20hakkinda%20bilgi%20almak%20istiyorum." class="btn-sub" target="_blank">
                <span>💬</span> WhatsApp ile Mesaj Gönder
            </a>

            <!-- 3. Doğrudan Arama Butonu -->
            <a href="tel:05425242477" class="btn-sub">
                <span>📞</span> Danışmanı Ara (0542 524 24 77)
            </a>
        </div>

        <div class="footer-note">Tek dokunuşla tüm detaylara ulaşabilirsiniz.</div>
    </div>

</body>
</html>
