<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehmet Poyraz - Hızlı Ödeme</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            background: #ffffff;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 360px;
            width: 90%;
            text-align: center;
        }
        .bank-badge {
            font-size: 13px;
            font-weight: 700;
            color: #006633;
            background: #e6f4ed;
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }
        h2 {
            margin: 0 0 4px;
            color: #1a1a1a;
            font-size: 22px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .info-box {
            background: #f8f9fa;
            border: 2px dashed #006633;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            text-align: left;
        }
        .info-label {
            font-size: 11px;
            color: #666;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .info-value {
            font-family: monospace;
            font-size: 14px;
            font-weight: 700;
            color: #1a1a1a;
            word-break: break-all;
        }
        .btn {
            background: #006633;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0,102,51,0.25);
            margin-top: 6px;
        }
        .btn:active {
            transform: scale(0.98);
            background: #004d26;
        }
        .toast {
            margin-top: 12px;
            font-size: 14px;
            color: #006633;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s ease;
            height: 18px;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="bank-badge">KUVEYT TÜRK</div>
        <h2>MEHMET POYRAZ</h2>
        <div class="subtitle">FAST Ödeme Paneli</div>

        <div class="info-box">
            <div class="info-label">Alıcı Adı</div>
            <div class="info-value">MEHMET POYRAZ</div>
        </div>

        <div class="info-box">
            <div class="info-label">IBAN Numarası</div>
            <div class="info-value">TR48 0020 5000 0005 6421 5000 05</div>
        </div>

        <button class="btn" onclick="copyAll()">İsim ve IBAN'ı Kopyala</button>
        <div class="toast" id="toastMessage">✓ Bilgiler panoya kopyalandı!</div>

        <div class="footer">
            Butona basarak bilgileri kopyalayın, banka uygulamanıza yapıştırın.
        </div>
    </div>

    <script>
        function copyAll() {
            const textToCopy = "Alıcı: MEHMET POYRAZ\nIBAN: TR480020500000056421500005";
            
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(showToast);
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = textToCopy;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast();
                } catch (err) {
                    console.error('Kopyalama başarısız', err);
                }
                document.body.removeChild(textArea);
            }
        }

        function showToast() {
            const toast = document.getElementById("toastMessage");
            toast.style.opacity = "1";
            setTimeout(() => {
                toast.style.opacity = "0";
            }, 2500);
        }
    </script>

</body>
</html>
