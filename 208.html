    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f4f5f7; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .iban-card {
            background: linear-gradient(135deg, #003399 0%, #001f52 100%);
            color: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 12px 28px rgba(0, 51, 153, 0.35);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* İş Bankası Arka Plan Süsü */
        .iban-card::after {
            content: "";
            position: absolute;
            top: -40px;
            right: -40px;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 50%;
        }

            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
