<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ziraat Bankası - Hızlı Ödeme Paneli</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            background: #ffffff;
            padding: 26px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 390px;
            width: 92%;
            text-align: center;
        }
        /* Dil Seçici Sekmeleri */
        .lang-selector {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 14px;
            direction: ltr;
        }
        .lang-btn {
            background: #e9ecef;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .lang-btn.active {
            background: #c51c1c;
            color: white;
        }
        .bank-badge {
            font-size: 13px;
            font-weight: 700;
            color: #c51c1c;
            background: #fde8e8;
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            color: #666;
            font-size: 13px;
            margin-bottom: 16px;
        }
        /* Hesap Bölücü Kutular */
        .account-section {
            background: #fafbfc;
            border: 1px solid #e1e4e8;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 16px;
            text-align: left;
        }
        .account-title {
            font-size: 14px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 10px;
            text-align: center;
            background: #e9ecef;
            padding: 6px;
            border-radius: 8px;
        }
        .section-label {
            font-size: 10px;
            color: #666;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .box {
            background: #ffffff;
            border: 2px dashed #c51c1c;
            padding: 9px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-family: monospace;
            font-size: 12px;
            font-weight: 700;
            color: #1a1a1a;
            word-break: break-all;
            text-align: center;
            direction: ltr;
        }
        .solid-box {
            border-style: solid;
            border-color: #d1d5db;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
        }
        .btn {
            background: #c51c1c;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 8px rgba(197,28,28,0.2);
            margin-bottom: 6px;
        }
        .btn:active {
            transform: scale(0.98);
            background: #a01515;
        }
        .btn-secondary {
            background: #2b2d42;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            margin-bottom: 0;
        }
        .btn-secondary:active {
            background: #1a1b2f;
        }
        .toast {
            font-size: 13px;
            color: #c51c1c;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.3s ease;
            height: 18px;
            margin-bottom: 8px;
        }
        .footer {
            font-size: 11px;
            color: #888;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <!-- DİL SEÇİCİ -->
        <div class="lang-selector">
            <button class="lang-btn active" onclick="setLanguage('tr', this)">Türkçe</button>
            <button class="lang-btn" onclick="setLanguage('en', this)">English</button>
            <button class="lang-btn" onclick="setLanguage('ar', this)">العربية</button>
        </div>

        <div class="bank-badge">ZİRAAT BANKASI</div>
        <div class="subtitle" id="txtSubtitle">Hızlı Ödeme Paneli</div>

        <!-- BİLDİRİM ALANI -->
        <div class="toast" id="toastMessage">✓ Kopyalandı!</div>

        <!-- 1. HESAP: MERYEM YILMAZ -->
        <div class="account-section">
            <div class="account-title">MERYEM YILMAZ</div>
            
            <div class="section-label" class="txtIbanLabel">IBAN Numarası</div>
            <div class="box">TR95 0001 0090 1085 4133 1050 01</div>
            <button class="btn" onclick="copyText('TR950001009010854133105001', translations[currentLang].toastIban)">IBAN'ı Kopyala</button>

            <div class="section-label" style="margin-top: 8px;">Alıcı Adı</div>
            <div class="box solid-box">MERYEM YILMAZ</div>
            <button class="btn btn-secondary" onclick="copyText('MERYEM YILMAZ', translations[currentLang].toastName)">İsmi Kopyala</button>
        </div>

        <!-- 2. HESAP: TANER YILMAZ -->
        <div class="account-section">
            <div class="account-title">TANER YILMAZ</div>
            
            <div class="section-label">IBAN Numarası</div>
            <div class="box">TR34 0001 0013 5982 4847 4150 04</div>
            <button class="btn" onclick="copyText('TR340001001359824847415004', translations[currentLang].toastIban)">IBAN'ı Kopyala</button>

            <div class="section-label" style="margin-top: 8px;">Alıcı Adı</div>
            <div class="box solid-box">TANER YILMAZ</div>
            <button class="btn btn-secondary" onclick="copyText('TANER YILMAZ', translations[currentLang].toastName)">İsmi Kopyala</button>
        </div>

        <div class="footer" id="txtFooter">
            İstediğiniz hesabın IBAN ve ismini tek tıkla kopyalayabilirsiniz.
        </div>
    </div>

    <script>
        let currentLang = 'tr';

        const translations = {
            tr: {
                subtitle: "Hızlı Ödeme Paneli",
                footer: "İstediğiniz hesabın IBAN ve ismini tek tıkla kopyalayabilirsiniz.",
                toastIban: "IBAN panoya kopyalandı!",
                toastName: "Alıcı adı panoya kopyalandı!"
            },
            en: {
                subtitle: "Fast Payment Panel",
                footer: "You can copy the IBAN and name of the desired account with one click.",
                toastIban: "IBAN copied to clipboard!",
                toastName: "Account name copied to clipboard!"
            },
            ar: {
                subtitle: "لوحة الدفع السريع",
                footer: "يمكنك نسخ الآيبان والاسم للحساب المطلوب بنقرة واحدة.",
                toastIban: "تم نسخ الآيبان!",
                toastName: "تم نسخ اسم المستفيد!"
            }
        };

        function setLanguage(lang, el) {
            currentLang = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');

            document.getElementById('txtSubtitle').innerText = translations[lang].subtitle;
            document.getElementById('txtFooter').innerText = translations[lang].footer;
            
            document.getElementById('mainCard').style.direction = (lang === 'ar') ? 'rtl' : 'ltr';
        }

        function copyText(text, message) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast(message));
            } else {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-999999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast(message);
                } catch (err) {
                    console.error('Kopyalama başarısız', err);
                }
                document.body.removeChild(textArea);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById("toastMessage");
            toast.innerText = "✓ " + msg;
            toast.style.opacity = "1";
            setTimeout(() => {
                toast.style.opacity = "0";
            }, 2500);
        }
    </script>

</body>
</html>
