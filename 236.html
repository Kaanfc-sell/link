<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÖZEN OTOMOTİV & İNŞAAT - sahibinden.com İlanımız</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 28px 20px;
            text-align: center;
            border: 1px solid #333333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: #FFC400;
        }
        .brand-name {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff; /* Şık Beyaz */
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .badge {
            display: inline-block;
            background-color: #FFC400;
            color: #000000;
            font-size: 14px;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
        }
        .info-text {
            font-size: 13px;
            color: #cccccc;
            margin-bottom: 22px;
            line-height: 1.4;
        }
        .btn-link {
            display: block;
            width: 100%;
            background-color: #FFC400;
            color: #000000;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            transition: transform 0.1s ease;
        }
        .btn-link:active {
            transform: scale(0.98);
        }
        .footer {
            margin-top: 18px;
            font-size: 11px;
            color: #777777;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="brand-name">ÖZEN OTOMOTİV & İNŞAAT</div>

        <div class="badge">sahibinden.com</div>

        <div class="info-text">
            İlanı ve tüm detayları sahibinden.com üzerinden incelemek için aşağıdaki butona tıklayın.
        </div>

        <a href="https://shbd.io/s/5JJ6lXBp" class="btn-link">
            💛 sahibinden.com'da Görüntüle
        </a>

        <div class="footer">
            Butona tıklayarak mağazayı açabilirsiniz.
        </div>
    </div>

</body>
</html>
